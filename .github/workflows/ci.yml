name: ZOX SuperApp CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Typecheck (TypeScript)
        run: npm run lint

      - name: Run Test Suite (17 Unit Tests)
        run: npm test

      - name: Production Bundle Build (Vite)
        run: npm run build
